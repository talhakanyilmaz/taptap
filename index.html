<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f2f2f0" />
<title>DON'T TAP</title>
<style>
  :root{
    --bg:#f2f2f0;
    --timer:#c9c9c5;
    --ink:#111111;
    --muted:#777774;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
  body{
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display",
      "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  #game{
    position:fixed; inset:0;
    background:var(--bg);
    color:var(--ink);
    overflow:hidden;
    cursor:pointer;
  }
  #fill{
    position:absolute;
    z-index:0;
    top:0; left:0; width:100%; height:0%;
    background:var(--timer);
    will-change:height, opacity;
    transition:opacity .08s linear;
  }
  #score{
    position:absolute;
    z-index:2;
    top:max(28px, calc(env(safe-area-inset-top) + 18px));
    left:0; width:100%;
    text-align:center;
    font-size:clamp(22px, 5vw, 34px);
    font-weight:500;
    letter-spacing:.03em;
    font-variant-numeric:tabular-nums;
  }
  #commandWrap{
    position:absolute;
    z-index:2;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }
  #command{
    text-align:center;
    font-size:clamp(42px, 12vw, 78px);
    line-height:.92;
    font-weight:800;
    letter-spacing:-.055em;
  }
  #hint{
    position:absolute;
    z-index:2;
    bottom:max(28px, calc(env(safe-area-inset-bottom) + 18px));
    left:0; width:100%;
    text-align:center;
    font-size:11px;
    letter-spacing:.18em;
    color:var(--muted);
    opacity:0;
    transition:opacity .15s ease;
  }
  #gameover{
    position:absolute;
    z-index:5;
    inset:0;
    display:none;
    background:#111;
    color:#f4f4f1;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
  }
  #finalScore{
    font-size:clamp(80px, 25vw, 150px);
    line-height:.8;
    font-weight:800;
    letter-spacing:-.07em;
    margin-bottom:30px;
  }
  #failed{
    font-size:13px;
    font-weight:700;
    letter-spacing:.24em;
    margin-bottom:12px;
  }
  #best{
    font-size:13px;
    letter-spacing:.14em;
    color:#92928e;
  }
  #retry{
    position:absolute;
    bottom:max(42px, calc(env(safe-area-inset-bottom) + 26px));
    font-size:12px;
    font-weight:700;
    letter-spacing:.2em;
    animation:pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse{50%{opacity:.35}}
  @media (min-width:700px){
    #game{
      width:min(430px,100vw);
      height:min(860px,100vh - 32px);
      inset:50% auto auto 50%;
      transform:translate(-50%,-50%);
      border-radius:28px;
    }
  }

#hapticToggle{position:absolute;right:12px;bottom:12px;z-index:40;border:0;background:transparent;color:#111;
font:600 10px/1 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:.07em;opacity:.4;padding:10px}
</style>
</head>
<body>
<main id="game" aria-label="Don't Tap prototype">
  <div id="fill"></div>
  <div id="score">0</div>
  <div id="commandWrap"><div id="bestGhost" style="position:absolute;top:62px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.16em;opacity:0;transition:opacity .15s"></div><div id="command">TAP</div></div>
  <div id="hint">TAP / DON'T TAP</div>

  <section id="gameover">
    <div id="finalScore">0</div>
    <div id="failed">FAILED</div>
    <div id="deathDetail" style="font-size:14px;letter-spacing:.12em;min-height:20px;margin:8px 0 2px"></div><div id="best">BEST 0</div>



    <div id="retry">TAP TO RETRY</div>
  </section>
</main>

<script src="https://www.youtube.com/game_api/v1"></script>

<script>
let ytAudioEnabled = true;
let ytPaused = false;
let ytLoaded = false;
let ytSave = {version:1,best:0,haptics:true};

async function ytLoadProgress(){
  if(!window.ytgame?.game){ ytLoaded=true; return; }
  try{
    const raw = await ytgame.game.loadData();
    if(raw){
      const data=JSON.parse(raw);
      if(data && typeof data==='object') ytSave={...ytSave,...data};
    }
  }catch(e){}
  ytLoaded=true;
}
async function ytSaveProgress(bestValue){
  if(!window.ytgame?.game || !ytLoaded) return;
  ytSave.best=Math.max(Number(ytSave.best)||0, Number(bestValue)||0);
  try{ await ytgame.game.saveData(JSON.stringify(ytSave)); }catch(e){}
}
function ytSendScore(value){
  try{ ytgame?.engagement?.sendScore({value:Number(value)||0}); }catch(e){}
}
function ytCanAudio(){ return !ytPaused && ytAudioEnabled; }
function ytVibrate(pattern){
  if(!ytSave.haptics || ytPaused || !navigator.vibrate) return false;
  try{return navigator.vibrate(pattern)}catch(e){return false}
}
async function ytInit(){
  if(!window.ytgame) return;
  try{ ytgame.game.firstFrameReady(); }catch(e){}
  try{
    ytAudioEnabled=!!ytgame.system.isAudioEnabled();
    ytgame.system.onAudioEnabledChange(v=>ytAudioEnabled=!!v);
    ytgame.system.onPause(()=>{ ytPaused=true; });
    ytgame.system.onResume(()=>{ ytPaused=false; });
  }catch(e){}
  await ytLoadProgress();
  try{ ytgame.game.gameReady(); }catch(e){}
}
</script>
<script>
(() => {
  const game = document.querySelector('#game');
  const fill = document.querySelector('#fill');
  const scoreEl = document.querySelector('#score');
  const commandEl = document.querySelector('#command');
  const over = document.querySelector('#gameover');
  const finalScore = document.querySelector('#finalScore');
  const bestEl = document.querySelector('#best');
  const deathDetail = document.querySelector('#deathDetail');
  const bestGhost = document.querySelector('#bestGhost');
  const copyTestData = document.querySelector('#copyTestData');
  const playtestMeta = document.querySelector('#playtestMeta');

  /*
    Production — YouTube Playables
    V7 mechanics/director remain intact. V8 adds:
      • best-score proximity tension
      • milestone micro-feedback
      • NEW BEST moment
      • X FROM BEST death feedback
      • revenge-pattern memory
      • near-zero-friction retry
      • lightweight procedural WebAudio feedback
  */

  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  const rand=(a,b)=>a+Math.random()*(b-a);
  const choice=a=>a[Math.floor(Math.random()*a.length)];

  let score=0;
  let best=Number(localStorage.getItem('dontTapBest')||0);
  let runStartBest=best;
  let state='playing';
  let command='TAP';
  let duration=1300;
  let start=0;
  let raf=0;
  let runNumber=1;

  let waitSwitchAt=Infinity;
  let waitHasSwitched=false;
  let waitTapStartedAt=0;

  let ignorePointerUntil=0;
  let failReason='';
  let failDelta=null;

  let queue=[];
  let currentPattern=null;
  let currentPatternStep=0;
  let revengePattern=null;
  let revengeEligibleAt=Infinity;
  let newBestAnnounced=false;

  // -------- V9 local telemetry --------
  const TEST_KEY='dontTapPlayables';
  const sessionId=(crypto?.randomUUID?.() || ('s_'+Date.now()+'_'+Math.random().toString(36).slice(2)));
  const sessionStartedAt=new Date().toISOString();
  let runId=1;
  let runStartedAt=performance.now();
  let roundIndex=0;
  let currentRoundLog=null;
  let lastDeathAt=null;
  let totalRetries=0;
  let tutorialActive=true;
  let tutorialStep=0;
  let tutorialTimer=0;
  let tutorialWaitSwitched=false;
  let commandPosition='center';
  let waitTapPosition='center';
  let waitPositionChanged=false;
  let anomalyActive=false;
  let anomalyTimer=0;
  let anomalyCountThisRun=0;
  let lastAnomalyScore=-999;
  let anomalyName=null;
  let anomalyStartedAt=0;
  let anomalyExpectedRT=null;
  let anomalyAwaitingTap=false;

  const telemetry={
    schema:'dont-tap-playables',
    version:1,
    sessionId,
    startedAt:sessionStartedAt,
    userAgent:navigator.userAgent,
    viewport:{width:innerWidth,height:innerHeight,dpr:devicePixelRatio||1},
    runs:[],
    rounds:[]
  };

  function safeLoadPrevious(){
    try{
      const raw=localStorage.getItem(TEST_KEY);
      if(!raw)return [];
      const parsed=JSON.parse(raw);
      return Array.isArray(parsed)?parsed:[];
    }catch{return [];}
  }

  function persistTelemetry(finalize=false){
    try{
      const history=safeLoadPrevious().filter(s=>s.sessionId!==telemetry.sessionId);
      const snapshot={
        ...telemetry,
        endedAt:finalize?new Date().toISOString():null,
        summary:buildSummary()
      };
      history.push(snapshot);
      localStorage.setItem(TEST_KEY,JSON.stringify(history.slice(-8)));
    }catch{}
  }

  function buildSummary(){
    const completed=telemetry.rounds.filter(r=>r.result);
    const successes=completed.filter(r=>r.result==='success');
    const failures=completed.filter(r=>r.result==='fail');
    const tapRTs=successes.filter(r=>r.command==='TAP'&&Number.isFinite(r.reactionTime)).map(r=>r.reactionTime);
    const waitRTs=successes.filter(r=>r.command==='WAIT'&&Number.isFinite(r.reactionTime)).map(r=>r.reactionTime);
    const runScores=telemetry.runs.map(r=>r.score).filter(Number.isFinite);
    const failCounts={};
    failures.forEach(r=>failCounts[r.failReason]=(failCounts[r.failReason]||0)+1);
    const retryMs=telemetry.runs.map(r=>r.retryMs).filter(Number.isFinite);

    const med=a=>a.length?Math.round(median(a,0)):null;
    return {
      runs:telemetry.runs.length,
      retries:totalRetries,
      best:runScores.length?Math.max(...runScores):score,
      averageScore:runScores.length?+(runScores.reduce((a,b)=>a+b,0)/runScores.length).toFixed(1):null,
      medianTapRT:med(tapRTs),
      medianWaitRT:med(waitRTs),
      failures:failCounts,
      medianRetryMs:med(retryMs),
      rounds:completed.length
    };
  }

  function exportPayload(){
    const current={
      ...telemetry,
      endedAt:new Date().toISOString(),
      summary:buildSummary()
    };
    return JSON.stringify(current,null,2);
  }

  async function copyTelemetry(){
    const text=exportPayload();
    try{
      await navigator.clipboard.writeText(text);
      if(copyTestData){
        const old=copyTestData.textContent;
        copyTestData.textContent='COPIED';
        setTimeout(()=>copyTestData.textContent=old,1100);
      }
    }catch{
      const ta=document.createElement('textarea');
      ta.value=text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
  }

  copyTestData?.addEventListener('pointerdown',e=>e.stopPropagation());
  copyTestData?.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();copyTelemetry();});

  const model={
    tapRTs:[],
    waitRTs:[],
    recentResults:[],
    pressure:.18,
    failures:{earlyWait:0,dont:0,lateTap:0,lateWait:0}
  };

  const director={
    phase:'warmup',
    phaseRounds:0,
    targetRounds:5,
    tension:.10,
    waitExpectationChain:0,
    lastPatternName:''
  };

  // -------- audio --------
  let audioCtx=null;
  function audio() {
    if(!audioCtx) {
      const AC=window.AudioContext||window.webkitAudioContext;
      if(AC) audioCtx=new AC();
    }
    if(audioCtx?.state==='suspended') audioCtx.resume();
    return audioCtx;
  }

  function tone(freq,dur=.035,gain=.025,type='sine',delay=0) {
    const ctx=audio();
    if(!ctx) return;
    const t=ctx.currentTime+delay;
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.type=type;
    o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(gain,t+.004);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t+dur+.01);
  }

  function successSound(kind) {
    const base=440+Math.min(score,100)*.75;
    if(kind==='WAIT') tone(base+55,.032,.021,'sine');
    else if(kind==='DONT') tone(base-80,.028,.014,'triangle');
    else tone(base,.026,.018,'sine');
  }

  function milestoneSound() {
    tone(560,.035,.022,'sine');
    tone(690,.04,.018,'sine',.045);
  }

  function newBestSound() {
    tone(610,.035,.022,'sine');
    tone(760,.04,.020,'sine',.045);
    tone(920,.05,.018,'sine',.09);
  }

  function failSound() {
    tone(150,.09,.035,'square');
  }

  // -------- player model --------
  function median(values,fallback) {
    if(!values.length)return fallback;
    const a=[...values].sort((x,y)=>x-y);
    const m=Math.floor(a.length/2);
    return a.length%2?a[m]:(a[m-1]+a[m])/2;
  }

  function pushRolling(arr,v,max=18) {
    arr.push(v);
    if(arr.length>max)arr.shift();
  }

  const tapRT=()=>clamp(median(model.tapRTs,390),260,650);
  const waitRT=()=>clamp(median(model.waitRTs,tapRT()+25),280,700);

  function successRate() {
    return model.recentResults.length
      ? model.recentResults.filter(Boolean).length/model.recentResults.length
      : 1;
  }

  function updatePressure(success) {
    pushRolling(model.recentResults,success,20);
    if(score<6)return;
    const rate=successRate();
    if(rate>=.96)model.pressure+=.03;
    else if(rate>=.90)model.pressure+=.012;
    else if(rate<.78)model.pressure-=.055;
    else if(rate<.85)model.pressure-=.025;
    model.pressure+=score>25?.003:.0015;
    model.pressure=clamp(model.pressure,0,1);
  }

  // -------- director --------
  function resetDirector() {
    director.phase='warmup';
    director.phaseRounds=0;
    director.targetRounds=runNumber===1?5:3;
    director.tension=.10;
    director.waitExpectationChain=0;
    director.lastPatternName='';
  }

  function advanceDirector() {
    director.phaseRounds++;
    if(director.phaseRounds<director.targetRounds)return;
    director.phaseRounds=0;

    if(director.phase==='warmup'){
      director.phase='build'; director.targetRounds=Math.floor(rand(3,6)); director.tension=.42;
    } else if(director.phase==='build'){
      director.phase='trap'; director.targetRounds=Math.floor(rand(2,4)); director.tension=.88;
    } else if(director.phase==='trap'){
      director.phase='relief'; director.targetRounds=Math.floor(rand(1,3)); director.tension=.20;
    } else {
      director.phase='build'; director.targetRounds=Math.floor(rand(3,6)); director.tension=.48;
    }
  }

  function dominantWeakness() {
    const f=model.failures;
    const a=[['earlyWait',f.earlyWait],['dont',f.dont],['lateTap',f.lateTap],['lateWait',f.lateWait]]
      .sort((x,y)=>y[1]-x[1]);
    return a[0][1]>=2?a[0][0]:null;
  }

  const patternBank=[
    {name:'momentum',tags:['dont'],seq:['TAP','TAP','TAP','DONT','TAP','DONT']},
    {name:'momentum-short',tags:['dont'],seq:['TAP','TAP','TAP','DONT']},
    {name:'freeze',tags:['lateTap'],seq:['DONT','DONT','TAP','DONT','TAP']},
    {name:'freeze-short',tags:['lateTap'],seq:['DONT','DONT','TAP']},
    {name:'switch',tags:['earlyWait'],seq:['TAP','DONT','WAIT','TAP']},
    {name:'switch-2',tags:['earlyWait'],seq:['DONT','TAP','WAIT','DONT']},
    {name:'mixed',tags:[],seq:['WAIT','TAP','DONT','TAP']},
    {name:'mixed-2',tags:[],seq:['TAP','WAIT','TAP','DONT']},
    {name:'mixed-3',tags:[],seq:['DONT','WAIT','TAP','TAP']},
    {name:'activation',tags:['lateTap'],seq:['DONT','TAP','TAP','TAP','DONT']}
  ];

  function choosePattern() {
    // At high skill, increase task-switch density instead of simply crushing deadlines.
    if(score>=60 && Math.random() < (score>=80 ? .72 : .52)){
      const p=highSkillPattern();
      currentPattern=p;
      currentPatternStep=0;
      queue=[...p.seq];
      director.lastPatternName=p.name;
      return;
    }

    // Revenge patterns return later, never immediately after death.
    if(revengePattern && score>=revengeEligibleAt && director.phase==='trap' && Math.random()<.48) {
      currentPattern=revengePattern;
      queue=[...revengePattern.seq];
      currentPatternStep=0;
      revengePattern=null;
      return;
    }

    const weakness=dominantWeakness();
    let pool=patternBank;

    if(weakness&&Math.random()<.27&&director.phase==='trap'){
      const targeted=patternBank.filter(p=>p.tags.includes(weakness));
      if(targeted.length)pool=targeted;
    }

    if(director.phase==='relief'){
      pool=patternBank.filter(p=>['mixed','mixed-2','mixed-3'].includes(p.name));
    }

    let p=choice(pool);
    if(pool.length>1&&p.name===director.lastPatternName){
      p=choice(pool.filter(x=>x.name!==director.lastPatternName));
    }

    director.lastPatternName=p.name;
    currentPattern=p;
    currentPatternStep=0;
    queue=[...p.seq];
  }

  function openingCommand() {
    const first=['TAP','TAP','DONT','TAP','WAIT','TAP'];
    const retry=['TAP','DONT','TAP'];
    const a=runNumber===1?first:retry;
    return score<a.length?a[score]:null;
  }

  function nextCommand() {
    const open=openingCommand();
    if(open){ currentPattern=null; return open; }

    if(director.phase==='trap'&&director.waitExpectationChain===0&&Math.random()<.18){
      director.waitExpectationChain=4;
      currentPattern={name:'expectation',tags:['earlyWait'],seq:['WAIT','WAIT','WAIT','WAIT']};
      currentPatternStep=0;
      queue=[...currentPattern.seq];
    }

    if(!queue.length)choosePattern();
    currentPatternStep++;
    return queue.shift();
  }


  function difficultyTier(){
    if(score>=80)return 'survival';
    if(score>=60)return 'expert';
    if(score>=40)return 'hard';
    if(score>=20)return 'normal+';
    return 'normal';
  }

  function highSkillPattern(){
    const expert=[
      {name:'expert-switch',tags:['earlyWait','dont'],seq:['TAP','TAP','DONT','TAP','WAIT','TAP','DONT']},
      {name:'expert-freeze',tags:['lateTap','dont'],seq:['DONT','TAP','DONT','DONT','TAP','WAIT','TAP']},
      {name:'expert-mixed',tags:['earlyWait'],seq:['WAIT','TAP','TAP','DONT','WAIT','TAP','DONT']},
      {name:'expert-reversal',tags:['dont'],seq:['TAP','DONT','TAP','TAP','DONT','WAIT','TAP']}
    ];
    const survival=[
      {name:'survival-switch',tags:['earlyWait','dont'],seq:['TAP','DONT','WAIT','TAP','DONT','TAP','WAIT','DONT']},
      {name:'survival-freeze',tags:['lateTap','dont'],seq:['DONT','DONT','TAP','WAIT','TAP','DONT','TAP','DONT']},
      {name:'survival-mixed',tags:['earlyWait'],seq:['WAIT','TAP','DONT','TAP','WAIT','TAP','TAP','DONT']}
    ];
    return choice(score>=80?survival:expert);
  }

  // -------- timings --------
  function tapDeadline() {
    const rt=tapRT(), p=model.pressure, t=director.tension, r=Math.random();
    let mult;

    // Approaching the personal best increases perceived tension mostly through
    // pattern/director behavior, not unfair deadline collapse.
    const nearBest = runStartBest>=10 && score>=runStartBest-3;

    if(director.phase==='relief'||r<.10)mult=rand(1.90,2.18);
    else if(director.phase==='trap'&&r>.58)mult=rand(1.28,1.46);
    else mult=rand(1.52-p*.10-t*.06,1.82-p*.10-t*.05);

    if(nearBest) mult*=.98; // tiny, almost imperceptible pressure only
    return clamp(rt*mult,470,1250);
  }

  function dontDuration() {
    const t=director.tension,r=Math.random();
    if(director.phase==='relief')return rand(820,1350);
    if(r<.28)return rand(450,700-t*70);
    if(r<.77)return rand(700,1200-t*100);
    return rand(1200,1750-t*130);
  }

  function waitPlan() {
    const rt=waitRT(),p=model.pressure;
    let waitTime;

    if(director.waitExpectationChain>0){
      waitTime=director.waitExpectationChain===1?rand(1180,1500):rand(470,580);
      director.waitExpectationChain--;
    } else {
      const r=Math.random();
      waitTime=r<.30?rand(470,620):r<.80?rand(680,980):rand(1100,1480);
    }

    waitTime=Math.max(450,waitTime);

    let mult;
    if(director.phase==='relief')mult=rand(1.68,1.90);
    else if(director.phase==='trap'&&Math.random()<.34)mult=rand(1.28,1.42);
    else mult=rand(1.45-p*.10,1.68-p*.08);

    return {waitTime,reactionWindow:clamp(rt*mult,400,850)};
  }

  function renderCommand() {
    if(command==='TAP')commandEl.textContent='TAP';
    else if(command==='DONT')commandEl.innerHTML="DON'T<br>TAP";
    else commandEl.textContent='WAIT';
  }

  function setupTiming() {
    waitHasSwitched=false;
    waitSwitchAt=Infinity;
    waitTapStartedAt=0;

    if(runNumber===1&&model.tapRTs.length<3&&command==='TAP'){
      duration=[1450,1350,1250][model.tapRTs.length];
      return;
    }

    if(command==='TAP')duration=tapDeadline();
    else if(command==='DONT')duration=dontDuration();
    else{
      const plan=waitPlan();
      waitSwitchAt=plan.waitTime;
      duration=plan.waitTime+plan.reactionWindow;
    }
  }




  // -------- awareness anomaly system --------
  // Rare, truthful interruptions based on the player's own measured behaviour.
  // They never impersonate sensors/camera access and are intentionally sparse.
  function anomalyEligible(){
    if(anomalyActive || tutorialActive || state!=='playing')return false;
    if(score<35 || anomalyCountThisRun>=3)return false;
    if(score-lastAnomalyScore<18)return false;
    const chance = score>=100 ? .10 : score>=80 ? .075 : score>=60 ? .055 : .035;
    return Math.random()<chance;
  }

  function anomalyPool(){
    const tap=median(model.tapRTs,390);
    const pool=[];
    if(model.tapRTs.length>=4 && score>=35)pool.push('mirrorRT');
    if(model.tapRTs.length>=6 && score>=55)pool.push('gettingFaster');
    if(score>=65)pool.push('longWait');
    if(model.tapRTs.length>=8 && score>=75)pool.push('proveMeWrong');
    if(score>=90)pool.push('calmDown');
    return pool;
  }

  function logAnomaly(name,extra={}){
    try{
      sessionData.anomalies=sessionData.anomalies||[];
      sessionData.anomalies.push({
        runId,score,name,atMs:Math.round(performance.now()-sessionStartedAt),...extra
      });
      persistSession();
    }catch(e){}
  }

  function finishAnomaly(delay=420){
    clearTimeout(anomalyTimer);
    anomalyAwaitingTap=false;
    anomalyActive=false;
    anomalyName=null;
    setTimeout(()=>newRound(),delay);
  }

  function showAnomalyText(text){
    fill.style.height='0%';
    fill.style.opacity='0';
    setCommandPosition('center');
    commandEl.innerHTML=text;
  }

  function startAnomaly(){
    const pool=anomalyPool();
    if(!pool.length)return false;
    anomalyActive=true;
    anomalyCountThisRun++;
    lastAnomalyScore=score;
    anomalyName=choice(pool);
    anomalyStartedAt=performance.now();
    cancelAnimationFrame(raf);
    clearTimeout(anomalyTimer);
    fill.style.height='0%';
    fill.style.opacity='0';

    const tapMedian=Math.round(median(model.tapRTs,390));
    logAnomaly(anomalyName,{tapMedian});

    if(anomalyName==='mirrorRT'){
      showAnomalyText(tapMedian+'ms');
      anomalyTimer=setTimeout(()=>{
        showAnomalyText("I'M LEARNING YOU.");
        anomalyTimer=setTimeout(()=>finishAnomaly(260),850);
      },720);
      return true;
    }

    if(anomalyName==='gettingFaster'){
      showAnomalyText("YOU'RE<br>GETTING FASTER.");
      anomalyTimer=setTimeout(()=>finishAnomaly(300),1050);
      return true;
    }

    if(anomalyName==='longWait'){
      showAnomalyText('WAIT');
      anomalyTimer=setTimeout(()=>{
        showAnomalyText('WHY ARE YOU<br>STILL WAITING?');
        anomalyTimer=setTimeout(()=>{
          showAnomalyText('TAP.');
          anomalyAwaitingTap=true;
          anomalyStartedAt=performance.now();
        },950);
      },3200);
      return true;
    }

    if(anomalyName==='proveMeWrong'){
      anomalyExpectedRT=tapMedian;
      showAnomalyText('I GIVE YOU<br>'+tapMedian+'ms.');
      anomalyTimer=setTimeout(()=>{
        showAnomalyText('TAP');
        anomalyAwaitingTap=true;
        anomalyStartedAt=performance.now();
      },1050);
      return true;
    }

    if(anomalyName==='calmDown'){
      showAnomalyText('CALM DOWN.');
      anomalyTimer=setTimeout(()=>{
        showAnomalyText('TAP');
        anomalyAwaitingTap=true;
        anomalyStartedAt=performance.now();
      },900);
      return true;
    }
    return false;
  }

  function handleAnomalyTap(){
    if(!anomalyActive)return false;
    if(!anomalyAwaitingTap){
      // During the "aware" text, taps do nothing; don't turn a surprise into an unfair death.
      return true;
    }
    const rt=Math.round(performance.now()-anomalyStartedAt);
    anomalyAwaitingTap=false;

    if(anomalyName==='proveMeWrong'){
      const won=rt<anomalyExpectedRT;
      logAnomaly('proveMeWrongResult',{reactionTime:rt,target:anomalyExpectedRT,won});
      showAnomalyText(won?'GOOD.':'I KNEW IT.');
      tone(won?720:240,.06,.018,won?'sine':'square');
      finishAnomaly(650);
      return true;
    }

    logAnomaly(anomalyName+'Tap',{reactionTime:rt});
    successSound('TAP');
    finishAnomaly(260);
    return true;
  }

  // -------- spatial command system --------
  const POSITION_STYLES={
    center:{left:'50%',top:'50%',transform:'translate(-50%,-50%)'},
    top:{left:'50%',top:'28%',transform:'translate(-50%,-50%)'},
    bottom:{left:'50%',top:'72%',transform:'translate(-50%,-50%)'},
    left:{left:'24%',top:'50%',transform:'translate(-50%,-50%)'},
    right:{left:'76%',top:'50%',transform:'translate(-50%,-50%)'}
  };

  function setCommandPosition(pos){
    const p=POSITION_STYLES[pos]||POSITION_STYLES.center;
    commandPosition=pos;
    commandEl.style.position='absolute';
    commandEl.style.left=p.left;
    commandEl.style.top=p.top;
    commandEl.style.transform=p.transform;
    commandEl.style.width='max-content';
    commandEl.style.maxWidth='62%';
    commandEl.style.textAlign='center';
  }

  function chooseCommandPosition(){
    if(score<20)return 'center';
    const r=Math.random();
    if(score<40){
      if(r<.80)return 'center';
    }else if(score<60){
      if(r<.55)return 'center';
    }else if(score<80){
      if(r<.30)return 'center';
    }
    return choice(['top','bottom','left','right']);
  }

  function chooseWaitTapPosition(waitPos){
    // Spatial surprise ramps in later than ordinary command movement.
    let chance=0;
    if(score>=80)chance=.58;
    else if(score>=60)chance=.42;
    else if(score>=40)chance=.26;
    else if(score>=20)chance=.10;

    if(Math.random()>=chance)return waitPos;
    return choice(['center','top','bottom','left','right'].filter(p=>p!==waitPos));
  }

  function spatialReactionAllowance(){
    // A changed WAIT→TAP location requires visual re-orienting; don't punish it
    // as though it were a same-location reaction.
    return waitPositionChanged ? 130 : 0;
  }

  // -------- first-session tutorial --------
  function showTutorialStep(){
    cancelAnimationFrame(raf);
    setCommandPosition('center');
    clearTimeout(tutorialTimer);
    fill.style.height='0%';
    fill.style.opacity='1';
    scoreEl.textContent='';
    if(bestGhost){bestGhost.textContent='';bestGhost.style.opacity='0';}

    if(tutorialStep===0){
      commandEl.textContent='TAP';
      // No deadline. First touch teaches the interaction; it is not telemetry.
    } else if(tutorialStep===1){
      commandEl.innerHTML="DON'T<br>TAP";
      fill.style.opacity='0';
      tutorialTimer=setTimeout(()=>{
        if(!tutorialActive || tutorialStep!==1)return;
        tutorialStep=2;
        showTutorialStep();
      },1500);
    } else if(tutorialStep===2){
      tutorialWaitSwitched=false;
      commandEl.textContent='WAIT';
      tutorialTimer=setTimeout(()=>{
        if(!tutorialActive || tutorialStep!==2)return;
        tutorialWaitSwitched=true;
        commandEl.textContent='TAP';
        tone(520,.025,.012,'sine');
        if(navigator.vibrate)ytVibrate(10);
      },900);
    } else {
      tutorialActive=false;
      scoreEl.textContent='0';
      commandEl.textContent='';
      setTimeout(()=>newRound(),220);
    }
  }

  function tutorialPointer(){
    if(tutorialStep===0){
      tutorialStep=1;
      successSound('TAP');
      showTutorialStep();
      return;
    }
    if(tutorialStep===1){
      // Tapping DON'T TAP restarts that teaching step without killing a run.
      if(navigator.vibrate)ytVibrate(35);
      clearTimeout(tutorialTimer);
      commandEl.innerHTML="DON'T<br>TAP";
      tutorialTimer=setTimeout(()=>{
        tutorialStep=2;
        showTutorialStep();
      },1500);
      return;
    }
    if(tutorialStep===2){
      if(tutorialWaitSwitched){
        successSound('WAIT');
        tutorialStep=3;
        showTutorialStep();
      } else {
        if(navigator.vibrate)ytVibrate(35);
        clearTimeout(tutorialTimer);
        tutorialWaitSwitched=false;
        commandEl.textContent='WAIT';
        tutorialTimer=setTimeout(()=>{
          tutorialWaitSwitched=true;
          commandEl.textContent='TAP';
          tone(520,.025,.012,'sine');
        },900);
      }
    }
  }

  // -------- run psychology --------
  function updateBestGhost() {
    if(!bestGhost)return;
    if(runStartBest>=10 && score>=Math.max(1,runStartBest-5) && score<=runStartBest){
      const gap=runStartBest-score;
      bestGhost.textContent=gap===0?'BEST':'BEST '+runStartBest;
      bestGhost.style.opacity=gap<=2?'0.42':'0.20';
    } else {
      bestGhost.textContent='';
      bestGhost.style.opacity='0';
    }
  }

  function pulseScore(scale=1.16,durationMs=150) {
    scoreEl.animate(
      [{transform:'scale(1)'},{transform:`scale(${scale})`},{transform:'scale(1)'}],
      {duration:durationMs,easing:'ease-out'}
    );
  }

  function runFeedbackAfterSuccess() {
    const hitNewBest = score>runStartBest && runStartBest>0 && !newBestAnnounced;

    if(hitNewBest){
      newBestAnnounced=true;
      pulseScore(1.28,220);
      newBestSound();
      if(navigator.vibrate)ytVibrate([12,30,12]);
    } else if(score>0 && score%10===0){
      pulseScore(1.18,170);
      milestoneSound();
      if(navigator.vibrate)ytVibrate([8,22,8]);
    }
    updateBestGhost();
  }

  
  function beginRoundTelemetry(){
    roundIndex++;
    currentRoundLog={
      sessionId,
      runId,
      round:roundIndex,
      scoreBefore:score,
      command,
      pattern:currentPattern?.name || 'opening',
      patternStep:currentPattern ? currentPatternStep : null,
      patternLength:currentPattern?.seq?.length || null,
      difficultyTier:difficultyTier(),
      anomalyCountThisRun,
      commandPosition,
      waitTapPosition:command==='WAIT'?waitTapPosition:null,
      switchPositionChanged:command==='WAIT'?waitPositionChanged:false,
      spatialAllowanceMs:command==='WAIT'&&waitPositionChanged?130:0,
      directorPhase:director.phase,
      pressure:+model.pressure.toFixed(3),
      duration:Math.round(duration),
      waitDuration:command==='WAIT'?Math.round(waitSwitchAt):null,
      startedAtMs:Math.round(performance.now()),
      reactionTime:null,
      elapsed:null,
      result:null,
      failReason:null,
      failDelta:null
    };
    telemetry.rounds.push(currentRoundLog);
  }

  function finishRoundTelemetry(result,reactionMs=null){
    if(!currentRoundLog || currentRoundLog.result)return;
    currentRoundLog.result=result;
    currentRoundLog.patternCompleted=!!(
      result==='success' &&
      currentRoundLog.patternStep &&
      currentRoundLog.patternLength &&
      currentRoundLog.patternStep>=currentRoundLog.patternLength
    );
    currentRoundLog.elapsed=Math.round(performance.now()-start);
    if(Number.isFinite(reactionMs))currentRoundLog.reactionTime=Math.round(reactionMs);
    if(result==='fail'){
      currentRoundLog.failReason=failReason||'unknown';
      currentRoundLog.failDelta=Number.isFinite(failDelta)?Math.round(failDelta):null;
    }
    persistTelemetry(false);
  }

  function closeRunTelemetry(){
    const existing=telemetry.runs.find(r=>r.runId===runId);
    if(existing)return;
    telemetry.runs.push({
      runId,
      score,
      bestAtRunStart:runStartBest,
      durationMs:Math.round(performance.now()-runStartedAt),
      deathReason:failReason||'unknown',
      retryMs:null
    });
  }

  function newRound() {
    state='playing';
    command=nextCommand();
    setupTiming();
    renderCommand();

    scoreEl.textContent=score;
    updateBestGhost();
    fill.style.height='0%';
    fill.style.opacity=command==='DONT'?'0':'1';

    start=performance.now();
    beginRoundTelemetry();
    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(tick);
  }

  function tick(now) {
    if(state!=='playing')return;
    const elapsed=now-start;
    const progress=Math.min(1,elapsed/duration);
    fill.style.height=(progress*100).toFixed(2)+'%';

    if(command==='WAIT'&&!waitHasSwitched&&elapsed>=waitSwitchAt){
      waitHasSwitched=true;
      waitTapStartedAt=now;
      commandEl.textContent='TAP';
      tone(520+Math.min(score,100)*.5,.025,.012,'sine');
      if(navigator.vibrate)ytVibrate(10);
    }

    if(progress>=1){
      if(command==='DONT')succeed(null);
      else{
        failReason=command==='TAP'?'lateTap':'lateWait';
        failDelta=Math.max(0,elapsed-duration);
        fail();
      }
      return;
    }
    raf=requestAnimationFrame(tick);
  }

  function succeed(reactionMs) {
    if(state!=='playing')return;
    cancelAnimationFrame(raf);

    const completedCommand=command;
    finishRoundTelemetry('success',reactionMs);
    if(command==='TAP'&&Number.isFinite(reactionMs))pushRolling(model.tapRTs,reactionMs);
    if(command==='WAIT'&&Number.isFinite(reactionMs))pushRolling(model.waitRTs,reactionMs);

    updatePressure(true);
    score++;
    successSound(completedCommand);
    runFeedbackAfterSuccess();
    advanceDirector();
    if(navigator.vibrate)ytVibrate(7);
    newRound();
  }

  function recordFailure() {
    if(failReason==='earlyWait')model.failures.earlyWait++;
    else if(failReason==='dont')model.failures.dont++;
    else if(failReason==='lateTap')model.failures.lateTap++;
    else if(failReason==='lateWait')model.failures.lateWait++;
  }

  function primaryDeathText() {
    if(failReason==='earlyWait'&&Number.isFinite(failDelta))return Math.round(failDelta)+'ms EARLY';
    if(failReason==='lateTap'||failReason==='lateWait')return 'TOO SLOW';
    if(failReason==='dont')return 'YOU TAPPED.';
    return 'FAILED';
  }

  function deathContext() {
    if(score>runStartBest && runStartBest>0)return 'NEW BEST';
    const gap=runStartBest-score;
    if(runStartBest>0 && gap>0 && gap<=9)return gap+' FROM BEST';
    return '';
  }

  function fail() {
    if(state!=='playing')return;
    state='over';
    cancelAnimationFrame(raf);
    finishRoundTelemetry('fail',null);
    closeRunTelemetry();
    lastDeathAt=performance.now();

    // Remember the trap that killed the player and offer it later as revenge.
    if(currentPattern && currentPattern.seq && currentPattern.seq.length>=3){
      revengePattern={...currentPattern,seq:[...currentPattern.seq]};
      revengeEligibleAt=Math.floor(rand(10,19));
    }

    recordFailure();
    updatePressure(false);

    if(score>best){
      best=score;
      ytSendScore(best);
      ytSaveProgress(best);
      localStorage.setItem('dontTapBest',String(best));
    }

    failSound();
    if(navigator.vibrate)ytVibrate([35,35,60]);

    finalScore.textContent=score;
    if(deathDetail){
      const primary=primaryDeathText();
      const context=deathContext();
      deathDetail.innerHTML=context
        ? `${primary}<br><span style="font-size:11px;opacity:.55">${context}</span>`
        : primary;
    }
    bestEl.textContent='BEST '+best;
    if(playtestMeta){
      const s=buildSummary();
      playtestMeta.textContent=`TEST · ${s.runs} RUN${s.runs===1?'':'S'} · ${s.rounds} ROUNDS`;
    }
    if(bestGhost){bestGhost.textContent='';bestGhost.style.opacity='0';}
    over.style.display='flex';
    ignorePointerUntil=performance.now()+180;
  }

  function restart() {
    const retryMs=Number.isFinite(lastDeathAt)?Math.round(performance.now()-lastDeathAt):null;
    const previousRun=telemetry.runs.find(r=>r.runId===runId);
    if(previousRun)previousRun.retryMs=retryMs;
    totalRetries++;
    persistTelemetry(false);

    score=0;
    clearTimeout(anomalyTimer);
    anomalyActive=false;
    anomalyAwaitingTap=false;
    anomalyName=null;
    anomalyCountThisRun=0;
    lastAnomalyScore=-999;
    setCommandPosition('center');
    runNumber++;
    runId++;
    roundIndex=0;
    runStartedAt=performance.now();
    runStartBest=best;
    newBestAnnounced=false;
    queue=[];
    currentPattern=null;
    currentPatternStep=0;
    failReason='';
    failDelta=null;
    model.recentResults=[];
    model.pressure=clamp(model.pressure-.08,.08,1);
    resetDirector();

    if(deathDetail)deathDetail.textContent='';
    over.style.display='none';
    fill.style.height='0%';
    fill.style.opacity='1';

    // Fast restart: no countdown / ready screen.
    requestAnimationFrame(newRound);
  }

  game.addEventListener('pointerdown',e=>{
    e.preventDefault();
    audio(); // unlock WebAudio on first user gesture
    const now=performance.now();

    if(ytPaused)return;

    if(anomalyActive){
      handleAnomalyTap();
      return;
    }

    if(tutorialActive){
      tutorialPointer();
      return;
    }

    if(state==='over'){
      if(now>=ignorePointerUntil)restart();
      return;
    }

    const elapsed=now-start;

    if(command==='TAP'){
      succeed(elapsed);
      return;
    }

    if(command==='DONT'){
      failReason='dont';
      failDelta=null;
      fail();
      return;
    }

    if(waitHasSwitched){
      succeed(now-waitTapStartedAt);
    } else {
      failReason='earlyWait';
      failDelta=Math.max(0,waitSwitchAt-elapsed);
      fail();
    }
  },{passive:false});

  window.addEventListener('pagehide',()=>persistTelemetry(true));
runStartBest=best;
  resetDirector();
  ytInit();
  showTutorialStep();
})();
</script>

<button id="hapticToggle" type="button">HAPTIC ON</button>
<script>
const hb=document.getElementById('hapticToggle');
function refreshHaptic(){hb.textContent=ytSave.haptics?'HAPTIC ON':'HAPTIC OFF'}
hb.addEventListener('click',e=>{e.stopPropagation();ytSave.haptics=!ytSave.haptics;refreshHaptic();ytSaveProgress(window.best||0)});
refreshHaptic();
</script>
</body>
